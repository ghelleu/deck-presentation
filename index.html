<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck Presentation</title>
  <meta name="description" content="Publications de présentations — deck-presentation.com">
  <style>
    :root {
      --plan: #f7f6f3;
      --encre: #111111;
      --encre-2: #6b6a66;
      --filet: #dddcd6;
      --police: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --plan: #131313; --encre: #f2f1ee; --encre-2: #9a9994; --filet: #2b2b2b; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--plan);
      color: var(--encre);
      font: 16px/1.5 var(--police);
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 980px; margin: 0 auto; padding: 12vh 24px 96px; }
    .tableau { overflow-x: auto; }
    table { width: 100%; min-width: 620px; border-collapse: collapse; }
    th, td { padding: 14px 12px; text-align: center; white-space: nowrap; }
    th {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--encre);
    }
    td { border-bottom: 1px solid var(--filet); font-size: 1rem; }
    tbody tr:last-child td { border-bottom-color: var(--encre); }
    td.code { font-weight: 600; letter-spacing: .04em; }
    /* a published deck: the whole row opens it */
    tr.lien { position: relative; cursor: pointer; }
    tr.lien a { color: inherit; text-decoration: none; }
    tr.lien a::after { content: ""; position: absolute; inset: 0; }
    tr.lien:hover td { background: color-mix(in srgb, var(--encre) 5%, transparent); }
    tr.lien:focus-within td { background: color-mix(in srgb, var(--encre) 8%, transparent); }
    /* not online yet */
    tr.attente td { color: var(--encre-2); }
  </style>
</head>
<body>
  <main>
    <div class="tableau">
      <table>
        <thead>
          <tr><th>Code</th><th>Client</th><th>Type</th><th>Context</th><th>Date</th></tr>
        </thead>
        <tbody>
          <!-- Une présentation en ligne : <tr class="lien"><td class="code"><a href="/code/">CODE</a></td>…
               Pas encore en ligne : <tr class="attente"><td class="code">CODE</td>… -->
          <tr class="lien"><td class="code"><a href="/als/">ALS</a></td><td>A. Lange &amp; Söhne</td><td>Inauguration</td><td>MCI</td><td>Nov. 2026</td></tr>
          <tr class="attente"><td class="code">HOW</td><td>House of Wunder</td><td>Événementiel</td><td>MCI</td><td>Nov. 2026</td></tr>
          <tr class="attente"><td class="code">CBM</td><td>Caroline Barbier Muller</td><td>Soirée</td><td>MCI</td><td>Nov. 2026</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
