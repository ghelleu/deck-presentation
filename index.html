<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck Presentation</title>
  <meta name="description" content="Publications de présentations — deck-presentation.com">
  <style>
    :root {
      --plan: #f7f6f3;
      --encre: #111111;
      --encre-2: #6b6a66;
      --filet: #dddcd6;
      --police: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --plan: #131313; --encre: #f2f1ee; --encre-2: #9a9994; --filet: #2b2b2b; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--plan);
      color: var(--encre);
      font: 16px/1.5 var(--police);
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 760px; margin: 0 auto; padding: 12vh 24px 96px; }
    .surtitre {
      margin: 0 0 18px;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--encre-2);
    }
    h1 { margin: 0 0 10px; font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 600; letter-spacing: -.02em; }
    .intro { margin: 0 0 56px; max-width: 52ch; color: var(--encre-2); font-size: 1.05rem; }
    h2 {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--encre-2);
      font-weight: 500;
    }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--filet); }
    li { border-bottom: 1px solid var(--filet); }
    li a {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      padding: 18px 4px;
      color: inherit;
      text-decoration: none;
    }
    li a:hover .titre { text-decoration: underline; text-underline-offset: 4px; }
    li .titre { font-size: 1.1rem; font-weight: 500; }
    li .fleche { font-size: 1.1rem; color: var(--encre-2); transition: transform .2s ease, color .2s ease; }
    li a:hover .fleche { transform: translateX(4px); color: var(--encre); }
    .vide { padding: 22px 4px; color: var(--encre-2); font-size: .95rem; }
    footer { margin-top: 72px; font-size: .8rem; color: var(--encre-2); }
  </style>
</head>
<body>
  <main>
    <h2>Publications</h2>
    <ul id="liste">
      <!-- Pour ajouter une présentation :
           <li><a href="/mon-deck/"><span class="titre">Mon deck</span><span class="fleche" aria-hidden="true">→</span></a></li>
           Sera remplacé par la liste réelle au fur et à mesure des publications. -->
      <li><a href="/als/"><span class="titre">A. Lange &amp; Söhne · Genève 2027</span><span class="fleche" aria-hidden="true">→</span></a></li>
    </ul>

  </main>
</body>
</html>
